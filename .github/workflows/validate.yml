name: Validate
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python dependency
        run: python3 -m pip install PyYAML==6.0.2
      - name: Check frontend build is current
        run: |
          python3 scripts/build-hacs-frontend.py
          git diff --exit-code -- dist/smartify-sip-manager.js
      - name: Run release checks
        run: bash release-check.sh
